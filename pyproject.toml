[project]
name = "kicktipp-worldcup-predictor"
version = "0.1.0"
description = "Local Kicktipp football score predictor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
py-modules = ["config", "kicktipp_tool", "models", "scoring"]

[tool.setuptools.packages.find]
include = ["data_sources*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
